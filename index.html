<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DJオファー屋さん太郎</title>
  <style>
    :root {
      --bg: #090b12;
      --panel: #121622;
      --panel-2: #181d2b;
      --card: #151a27;
      --card-soft: #1b2131;
      --text: #f4f6fb;
      --muted: #9ca6bb;
      --line: rgba(255,255,255,.08);
      --primary: #8b5cf6;
      --primary-2: #6d5dfc;
      --blue: #4f8cff;
      --orange: #ff9f43;
      --green: #41d18b;
      --red: #ff6b6b;
      --gray: #737b8e;
      --shadow: 0 14px 40px rgba(0,0,0,.35);
      --radius: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(139,92,246,.28), transparent 34%),
        radial-gradient(circle at top right, rgba(79,140,255,.18), transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    button, input, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }

    .app {
      width: min(480px, 100%);
      margin: 0 auto;
      padding: 14px 14px 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      margin: 0 -14px 10px;
      padding: calc(10px + env(safe-area-inset-top)) 14px 12px;
      background: rgba(9,11,18,.82);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    h1 {
      font-size: 20px;
      line-height: 1;
      margin: 0;
      letter-spacing: .02em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 7px;
    }

    .top-actions { display: flex; gap: 9px; align-items: center; }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      color: white;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--line);
      font-size: 22px;
      line-height: 1;
    }

    .add-main {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      font-size: 30px;
      line-height: 1;
      box-shadow: 0 10px 24px rgba(139,92,246,.35);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 14px 0 4px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 5px;
    }

    .tab {
      color: var(--muted);
      background: transparent;
      border-radius: 13px;
      padding: 10px 4px;
      font-weight: 700;
      font-size: 13px;
    }

    .tab.active {
      color: white;
      background: linear-gradient(135deg, rgba(139,92,246,.95), rgba(79,140,255,.86));
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin: 18px 2px 10px;
    }

    .section-head h2 {
      font-size: 22px;
      margin: 0;
    }

    .small-btn {
      color: white;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 11px;
      font-size: 12px;
      font-weight: 700;
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 2px 8px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 9px 14px;
      color: var(--muted);
      background: rgba(255,255,255,.06);
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 700;
    }

    .chip.active {
      color: white;
      background: rgba(139,92,246,.22);
      border-color: rgba(139,92,246,.5);
    }

    .list { display: grid; gap: 10px; }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.025)), var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 15px;
      box-shadow: var(--shadow);
    }

    .event-card {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .datebox {
      text-align: center;
      border-radius: 16px;
      background: rgba(255,255,255,.055);
      padding: 10px 4px;
      border: 1px solid var(--line);
    }

    .datebox .md { font-size: 20px; font-weight: 900; }
    .datebox .day { color: var(--blue); font-size: 13px; font-weight: 800; margin-top: 2px; }
    .datebox .time { color: var(--muted); font-size: 11px; margin-top: 7px; }

    .title { font-size: 17px; font-weight: 400; margin: 0 0 7px; }
    .meta { color: var(--muted); font-size: 13px; display: grid; gap: 5px; }
    .meta-row { display: flex; gap: 7px; align-items: center; }

    .right-info { text-align: right; display: grid; gap: 9px; justify-items: end; }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }
    .b-progress { color: #c9b8ff; background: rgba(139,92,246,.18); }
    .b-offer { color: #ffc27e; background: rgba(255,159,67,.14); }
    .b-ready { color: #c8ccd6; background: rgba(255,255,255,.09); }
    .b-done { color: #91efbd; background: rgba(65,209,139,.14); }
    .b-ng { color: #ffa1a1; background: rgba(255,107,107,.14); }
    .count { font-weight: 900; font-size: 16px; }
    .arrow { color: var(--muted); font-size: 24px; }

    .candidate-card, .reply-card {
      display: grid;
      gap: 11px;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .dj-name { font-size: 19px; font-weight: 400; }
    .event-mini { color: var(--muted); font-size: 13px; margin-top: 3px; }

    .status-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .status-btn {
      padding: 10px 4px;
      border-radius: 13px;
      background: rgba(255,255,255,.06);
      color: var(--muted);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 900;
    }

    .status-btn.active.ok { color: var(--green); border-color: rgba(65,209,139,.45); background: rgba(65,209,139,.12); }
    .status-btn.active.offer { color: var(--orange); border-color: rgba(255,159,67,.45); background: rgba(255,159,67,.12); }
    .status-btn.active.wait { color: #91b7ff; border-color: rgba(79,140,255,.45); background: rgba(79,140,255,.12); }
    .status-btn.active.ng { color: var(--red); border-color: rgba(255,107,107,.45); background: rgba(255,107,107,.12); }

    .note {
      width: 100%;
      min-height: 44px;
      resize: vertical;
      color: var(--text);
      background: rgba(255,255,255,.055);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      outline: none;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 34px 16px;
      border: 1px dashed rgba(255,255,255,.15);
      border-radius: 20px;
      background: rgba(255,255,255,.03);
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      z-index: 30;
      width: min(480px, 100%);
      padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
      background: rgba(13,16,25,.92);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .nav-btn {
      color: var(--muted);
      background: transparent;
      border-radius: 15px;
      padding: 8px 3px 7px;
      font-size: 11px;
      font-weight: 800;
    }
    .nav-btn span { display: block; font-size: 22px; margin-bottom: 3px; }
    .nav-btn.active { color: white; background: rgba(139,92,246,.18); }

    dialog {
      width: min(440px, calc(100% - 22px));
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      color: var(--text);
      padding: 0;
      box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgba(0,0,0,.72); }

    .modal-head {
      padding: 17px 17px 11px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-head strong { font-size: 18px; }
    .close { background: transparent; color: var(--muted); font-size: 24px; }

    .form { padding: 14px 17px 17px; display: grid; gap: 10px; }
    .field label { display: block; color: var(--muted); font-size: 12px; font-weight: 800; margin: 0 0 5px 2px; }
    .field input, .field select {
      width: 100%;
      color: var(--text);
      background: rgba(255,255,255,.055);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      outline: none;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .primary-btn {
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border-radius: 15px;
      padding: 13px;
      font-weight: 900;
      margin-top: 4px;
    }

    .danger-btn {
      color: #ffb4b4;
      background: rgba(255,107,107,.12);
      border: 1px solid rgba(255,107,107,.25);
      border-radius: 15px;
      padding: 12px;
      font-weight: 900;
    }

    .backup-box {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 13px;
      display: grid;
      gap: 9px;
    }
    .backup-box strong { font-size: 15px; }
    .backup-box p { color: var(--muted); font-size: 12px; line-height: 1.55; margin: 0; }
    .backup-actions { display: grid; gap: 9px; }
    .file-input { display: none; }



    /* 2026-06 修正版：スマホで候補欄を小さくシンプルに */
    .topline { justify-content: space-between; position: static; min-height: 48px; }
    .topline h1 { text-align: left; font-size: 20px; font-weight: 500; }
    .top-actions { position: static; right: auto; top: auto; }
    .candidate-card { padding: 0; overflow: hidden; gap: 0; }
    .candidate-row {
      display: grid;
      grid-template-columns: 42px 1fr auto 22px;
      gap: 10px;
      align-items: center;
      min-height: 62px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .avatar {
      width: 34px; height: 34px; border-radius: 999px;
      display: grid; place-items: center;
      background: rgba(255,255,255,.10);
      color: #fff; font-weight: 900;
    }
    .candidate-main { min-width: 0; }
    .candidate-main .dj-name { font-size: 16px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .candidate-main .event-mini { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .candidate-row .badge { min-width: 62px; justify-content: center; padding: 6px 10px; }
    .candidate-detail { display:none; padding: 0 12px 12px 64px; }
    .candidate-card.open .candidate-detail { display:grid; gap:8px; }
    .status-actions { grid-template-columns: repeat(3, 1fr); }
    .candidate-card .danger-btn { padding: 9px; font-size: 12px; }
    .note { min-height: 38px; font-size: 13px; }
    .compact-list { gap: 0; overflow: hidden; padding: 0; }
    .compact-list .candidate-card { border-radius: 0; border-left: 0; border-right: 0; border-top: 0; box-shadow:none; background: transparent; }
    .compact-list .candidate-card:first-child { border-top-left-radius: var(--radius); border-top-right-radius: var(--radius); }
    .compact-list .candidate-card:last-child { border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius); border-bottom:0; }

    @media (max-width: 390px) {
      .event-card { grid-template-columns: 64px 1fr auto; gap: 9px; padding: 13px; }
      .datebox .md { font-size: 18px; }
      .title { font-size: 16px; }
      .meta { font-size: 12px; }
      .badge { font-size: 11px; padding: 5px 8px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topline">
        <div>
          <h1>DJオファー屋さん太郎</h1>
          
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="settingsBtn" aria-label="設定">⚙︎</button>
          <button class="add-main" id="addBtn" aria-label="追加">＋</button>
        </div>
      </div>
      <div class="tabs" aria-label="画面切り替え">
        <button class="tab active" data-tab="events">イベント一覧</button>
        <button class="tab" data-tab="candidates">オファー候補</button>
        <button class="tab" data-tab="replies">返答状況</button>
      </div>
    </header>

    <main id="main"></main>
  </div>


  <dialog id="eventDialog">
    <div class="modal-head">
      <strong>イベントを追加</strong>
      <button class="close" data-close>×</button>
    </div>
    <form class="form" id="eventForm">
      <div class="field"><label>イベント名</label><input name="name" required placeholder="例：KNOT Saturday"></div>
      <div class="form-grid">
        <div class="field"><label>日付</label><input name="date" type="date" required></div>
        <div class="field"><label>時間</label><input name="time" placeholder="22:00-05:00"></div>
      </div>
      <div class="field"><label>会場</label><input name="venue" placeholder="例：池袋 KNOT"></div>
      <div class="field"><label>ジャンル</label><input name="genre" placeholder="例：All Good Music"></div>
      <div class="form-grid">
        <div class="field"><label>必要人数</label><input name="slots" type="number" min="1" value="5"></div>
        <div class="field"><label>状態</label><select name="status"><option>準備中</option><option>オファー中</option><option>進行中</option><option>終了</option></select></div>
      </div>
      <button class="primary-btn">追加する</button>
    </form>
  </dialog>

  <dialog id="candidateDialog">
    <div class="modal-head">
      <strong>候補を追加</strong>
      <button class="close" data-close>×</button>
    </div>
    <form class="form" id="candidateForm">
      <div class="field"><label>DJ名</label><input name="dj" required placeholder="例：PINO"></div>
      <div class="field"><label>イベント</label><select name="eventId" id="candidateEventSelect"></select></div>
      <div class="form-grid">
        <div class="field"><label>状態</label><select name="status"><option>候補</option><option>オファー済</option><option>OK</option><option>保留</option><option>NG</option></select></div>
        <input type="hidden" name="slot" value="">
      </div>
      <div class="field"><label>メモ</label><input name="memo" placeholder="例：22時台希望 / 連絡はInstagram"></div>
      <button class="primary-btn">追加する</button>
    </form>
  </dialog>


  <dialog id="settingsDialog">
    <div class="modal-head">
      <strong>設定・バックアップ</strong>
      <button class="close" data-close>×</button>
    </div>
    <div class="form">
      <div class="backup-box">
        <strong>JSONバックアップ</strong>
        <p>イベント、オファー候補、返答状況をまとめて保存します。iPhoneの「ファイル」やiCloud Driveに残しておくと安心です。</p>
        <div class="backup-actions">
          <button class="primary-btn" type="button" onclick="exportBackup()">バックアップを書き出す</button>
          <button class="small-btn" type="button" onclick="document.getElementById('importFile').click()">バックアップを読み込む</button>
          <input class="file-input" id="importFile" type="file" accept="application/json,.json">
        </div>
      </div>
      <div class="backup-box">
        <strong>データ削除</strong>
        <p>この端末のブラウザ内に保存されているデータだけを削除します。バックアップがない場合は元に戻せません。</p>
        <button class="danger-btn" type="button" onclick="resetAllData()">全データ削除</button>
      </div>
    </div>
  </dialog>

  <script>
    const STORAGE_KEY = 'dj-offer-manager-dark-v2';
    const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
    const $ = (q, root = document) => root.querySelector(q);
    const $$ = (q, root = document) => [...root.querySelectorAll(q)];

    let currentTab = 'events';
    let filter = 'すべて';

    const sample = {
      events: [
        { id: uid(), name: 'KNOT Saturday', date: '2026-06-15', time: '22:00-05:00', venue: '池袋 KNOT', genre: 'All Good Music', slots: 6, status: '進行中' },
        { id: uid(), name: 'Groove Night', date: '2026-06-22', time: '22:00-05:00', venue: '下北沢 ERA', genre: 'House / Techno', slots: 5, status: 'オファー中' },
        { id: uid(), name: 'Summer Vibes', date: '2026-07-06', time: '22:00-05:00', venue: '渋谷 CONTACT', genre: 'Hip Hop / R&B', slots: 6, status: '準備中' }
      ],
      candidates: []
    };
    sample.candidates = [
      { id: uid(), eventId: sample.events[0].id, dj: 'PINO', slot: '', status: 'OK', memo: '22:00予定。フライヤー送付済み' },
      { id: uid(), eventId: sample.events[0].id, dj: 'KAZUKI', slot: '', status: 'オファー済', memo: '返答待ち' },
      { id: uid(), eventId: sample.events[0].id, dj: 'YUTO', slot: '', status: 'OK', memo: '' },
      { id: uid(), eventId: sample.events[1].id, dj: 'MARI', slot: '', status: '保留', memo: '交通費確認' },
      { id: uid(), eventId: sample.events[1].id, dj: 'TAKA', slot: '', status: 'NG', memo: 'この日は別件あり' }
    ];

    let data = load();

    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return saved && saved.events ? saved : sample;
      } catch { return sample; }
    }

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

    function fmtDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      if (Number.isNaN(d.getTime())) return { md: '--.--', day: '', full: '' };
      const days = ['日','月','火','水','木','金','土'];
      return {
        md: `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`,
        day: `(${days[d.getDay()]})`,
        full: `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`
      };
    }

    function badgeClass(status) {
      if (status === '進行中') return 'b-progress';
      if (status === 'オファー中' || status === 'オファー済') return 'b-offer';
      if (status === '終了' || status === 'OK') return 'b-done';
      if (status === 'NG') return 'b-ng';
      if (status === '保留') return 'b-offer';
      if (status === '未読') return 'b-ready';
      return 'b-ready';
    }

    function getEvent(id) { return data.events.find(e => e.id === id); }
    function okCount(eventId) { return data.candidates.filter(c => c.eventId === eventId && c.status === 'OK').length; }

    function render() {
      $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === currentTab));
      if (currentTab === 'events') renderEvents();
      if (currentTab === 'candidates') renderCandidates();
      if (currentTab === 'replies') renderReplies();
    }

    function renderEvents() {
      const filters = ['すべて','準備中','オファー中','進行中','終了'];
      const events = data.events
        .slice()
        .sort((a,b) => a.date.localeCompare(b.date))
        .filter(e => filter === 'すべて' || e.status === filter);

      $('#main').innerHTML = `
        <div class="section-head"><h2>イベント一覧</h2><button class="small-btn" onclick="openEventDialog()">＋ イベント</button></div>
        <div class="chips">${filters.map(f => `<button class="chip ${filter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}</div>
        <div class="list">
          ${events.length ? events.map(eventCard).join('') : `<div class="empty">イベントがありません</div>`}
        </div>`;
    }

    function eventCard(e) {
      const d = fmtDate(e.date);
      return `
        <article class="card event-card" onclick="showEventDetail('${e.id}')">
          <div class="datebox"><div class="md">${d.md}</div><div class="day">${d.day}</div><div class="time">${e.time || ''}</div></div>
          <div>
            <p class="title">${escapeHtml(e.name)}</p>
            <div class="meta">
              <div class="meta-row">📍 ${escapeHtml(e.venue || '会場未定')}</div>
              <div class="meta-row">♪ ${escapeHtml(e.genre || 'ジャンル未定')}</div>
            </div>
          </div>
          <div class="right-info">
            <span class="badge ${badgeClass(e.status)}">${e.status}</span>
            <span class="count">${okCount(e.id)}/${e.slots || 0}人</span>
            <span class="arrow">›</span>
          </div>
        </article>`;
    }

    function showEventDetail(id) {
      const e = getEvent(id);
      if (!e) return;
      currentTab = 'candidates';
      filter = e.id;
      render();
    }

    function renderCandidates() {
      const eventOptions = ['すべて', ...data.events.map(e => e.id)];
      const candidates = data.candidates.filter(c => filter === 'すべて' || c.eventId === filter);
      $('#main').innerHTML = `
        <div class="section-head"><h2>オファー候補</h2><button class="small-btn" onclick="openCandidateDialog()">＋ 候補</button></div>
        <div class="chips">
          ${eventOptions.map(v => {
            const label = v === 'すべて' ? 'すべて' : escapeHtml(getEvent(v)?.name || '不明');
            return `<button class="chip ${filter===v?'active':''}" onclick="setFilter('${v}')">${label}</button>`;
          }).join('')}
        </div>
        <div class="list compact-list">
          ${candidates.length ? candidates.map(candidateCard).join('') : `<div class="empty">候補がありません</div>`}
        </div>`;
    }

    function candidateCard(c) {
      const e = getEvent(c.eventId);
      const initial = escapeHtml((c.dj || '?').trim().charAt(0).toUpperCase());
      return `
        <article class="card candidate-card" id="cand-${c.id}">
          <div class="candidate-row" onclick="toggleCandidate('${c.id}')">
            <div class="avatar">${initial}</div>
            <div class="candidate-main">
              <div class="dj-name">${escapeHtml(c.dj)}</div>
              <div class="event-mini">${escapeHtml(e?.name || '')}</div>
            </div>
            <span class="badge ${badgeClass(c.status)}">${c.status}</span>
            <span class="arrow">›</span>
          </div>
          <div class="candidate-detail">
            <div class="event-mini">${escapeHtml(e?.name || 'イベント未設定')}${c.memo ? ' / ' + escapeHtml(c.memo) : ''}</div>
            <div class="status-actions">
              ${statusButton(c, 'オファー済', 'offer')}
              ${statusButton(c, 'OK', 'ok')}
              ${statusButton(c, 'NG', 'ng')}
            </div>
            <textarea class="note" placeholder="メモ" onchange="updateMemo('${c.id}', this.value)">${escapeHtml(c.memo || '')}</textarea>
            <button class="danger-btn" onclick="deleteCandidate('${c.id}')">削除</button>
          </div>
        </article>`;
    }

    function statusButton(c, status, cls) {
      return `<button class="status-btn ${c.status===status?'active':''} ${cls}" onclick="setCandidateStatus('${c.id}','${status}')">${status.replace('オファー済','済')}</button>`;
    }

    function renderReplies() {
      const groups = ['OK','オファー済','保留','NG','候補'];
      $('#main').innerHTML = `
        <div class="section-head"><h2>返答状況</h2><button class="small-btn" onclick="openCandidateDialog()">＋ 候補</button></div>
        <div class="list">
          ${groups.map(status => replyGroup(status)).join('')}
        </div>`;
    }

    function replyGroup(status) {
      const items = data.candidates.filter(c => c.status === status);
      return `
        <section class="card reply-card">
          <div class="row-between"><strong>${status}</strong><span class="badge ${badgeClass(status)}">${items.length}人</span></div>
          ${items.length ? items.map(c => {
            const e = getEvent(c.eventId);
            return `<div class="row-between" style="border-top:1px solid var(--line); padding-top:10px;">
              <div><div class="dj-name" style="font-size:16px;">${escapeHtml(c.dj)}</div><div class="event-mini">${escapeHtml(e?.name || '')}${c.memo ? ' / ' + escapeHtml(c.memo) : ''}</div></div>
              <button class="small-btn" onclick="jumpCandidate('${c.eventId}')">見る</button>
            </div>`;
          }).join('') : `<div class="event-mini">該当なし</div>`}
        </section>`;
    }

    function toggleCandidate(id) {
      const el = document.getElementById('cand-' + id);
      if (el) el.classList.toggle('open');
    }

    function jumpCandidate(eventId) {
      currentTab = 'candidates';
      filter = eventId || 'すべて';
      render();
    }

    function setFilter(v) { filter = v; render(); }

    function setCandidateStatus(id, status) {
      const c = data.candidates.find(x => x.id === id);
      if (!c) return;
      c.status = status;
      save(); render();
    }

    function updateMemo(id, memo) {
      const c = data.candidates.find(x => x.id === id);
      if (!c) return;
      c.memo = memo;
      save();
    }

    function deleteCandidate(id) {
      if (!confirm('この候補を削除しますか？')) return;
      data.candidates = data.candidates.filter(c => c.id !== id);
      save(); render();
    }

    function openEventDialog() { $('#eventDialog').showModal(); }
    function openCandidateDialog() {
      const select = $('#candidateEventSelect');
      select.innerHTML = data.events.map(e => `<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('');
      if (filter !== 'すべて' && getEvent(filter)) select.value = filter;
      $('#candidateDialog').showModal();
    }

    $('#addBtn').addEventListener('click', () => currentTab === 'events' ? openEventDialog() : openCandidateDialog());
    $('#settingsBtn').addEventListener('click', () => $('#settingsDialog').showModal());

    $$('.tab').forEach(b => b.addEventListener('click', () => {
      currentTab = b.dataset.tab;
      filter = 'すべて';
      render();
    }));

    $$('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));

    $('#eventForm').addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(e.currentTarget);
      data.events.push({
        id: uid(),
        name: fd.get('name').trim(),
        date: fd.get('date'),
        time: fd.get('time').trim(),
        venue: fd.get('venue').trim(),
        genre: fd.get('genre').trim(),
        slots: Number(fd.get('slots') || 1),
        status: fd.get('status')
      });
      save();
      e.currentTarget.reset();
      $('#eventDialog').close();
      filter = 'すべて';
      currentTab = 'events';
      render();
    });

    $('#candidateForm').addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(e.currentTarget);
      data.candidates.push({
        id: uid(),
        eventId: fd.get('eventId'),
        dj: fd.get('dj').trim(),
        slot: fd.get('slot').trim(),
        status: fd.get('status'),
        memo: fd.get('memo').trim()
      });
      save();
      e.currentTarget.reset();
      $('#candidateDialog').close();
      currentTab = 'candidates';
      render();
    });


    function exportBackup() {
      const payload = {
        app: 'DJオファー屋さん太郎',
        version: 1,
        exportedAt: new Date().toISOString(),
        data
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const a = document.createElement('a');
      a.href = url;
      a.download = `dj_offer_backup_${y}-${m}-${d}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    $('#importFile').addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        const json = JSON.parse(text);
        const imported = json.data || json;
        if (!imported.events || !Array.isArray(imported.events) || !imported.candidates || !Array.isArray(imported.candidates)) {
          throw new Error('invalid backup');
        }
        if (!confirm('現在のデータをバックアップ内容で置き換えますか？')) return;
        data = imported;
        save();
        currentTab = 'events';
        filter = 'すべて';
        $('#settingsDialog').close();
        render();
        alert('バックアップを読み込みました');
      } catch (err) {
        alert('読み込みできませんでした。JSONバックアップファイルを選んでください。');
      } finally {
        e.target.value = '';
      }
    });

    function resetAllData() {
      if (!confirm('全データを削除しますか？')) return;
      if (!confirm('バックアップがない場合は元に戻せません。本当に削除しますか？')) return;
      data = { events: [], candidates: [] };
      save();
      currentTab = 'events';
      filter = 'すべて';
      $('#settingsDialog').close();
      render();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>'"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]));
    }

    render();
  </script>
</body>
</html>
